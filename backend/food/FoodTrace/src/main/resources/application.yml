server:
  port: 8080

spring:
  application:
    name: food-trace-system
  # ?? Swagger2 ? Spring Boot 2.6+ ???????
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/food_trace_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trace.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ??? WeBASE ????
webase:
  front:
    url: http://127.0.0.1:5002/WeBASE-Front/

  test-accounts:
